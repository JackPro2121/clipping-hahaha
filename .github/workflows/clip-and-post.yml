name: Clip & Post

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: clip-post
  cancel-in-progress: false

jobs:
  clip-and-post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Discover sources
        env:
          CHOCODATA_API_KEY: ${{ secrets.CHOCODATA_API_KEY }}
        run: python src/find_sources.py

      - name: Run pipeline
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          CHOCODATA_API_KEY: ${{ secrets.CHOCODATA_API_KEY }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          WEBSHARE_PROXIES: ${{ secrets.WEBSHARE_PROXIES }}
        run: python src/main.py

      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sources.json
          git commit -m "Update source state" || echo "no changes"
          git push