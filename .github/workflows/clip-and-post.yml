name: Clip & Post

on:
  workflow_dispatch:
  schedule:
    # 1) UK/Europe Lunch & US Morning Peak (1:30 PM UK / 2:30 PM CET / 8:30 AM EST)
    - cron: "30 12 * * *"
    # 2) US Afternoon & UK/Europe Evening Prime Time (1:00 PM EST / 6:00 PM UK / 7:00 PM CET)
    - cron: "0 17 * * *"
    # 3) US Golden Prime Time & Australia Morning (7:00 PM EST / 4:00 PM PST / 9:00 AM AEST)
    - cron: "0 23 * * *"
    # 4) Australia Afternoon & APAC Peak Scrolling (4:00 PM Sydney / 11:00 PM PST)
    - cron: "0 6 * * *"

permissions:
  contents: write

concurrency:
  group: clip-post
  cancel-in-progress: false

jobs:
  clip-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 90   # prevent stalled downloads blocking the concurrency group

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"   # cache pip downloads — saves ~20-30s per run

      - name: Install ffmpeg
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get install -y ffmpeg || true
          fi
          if ! command -v ffmpeg >/dev/null; then
            curl -sL --max-time 60 https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz -o /tmp/ff.tar.xz
            tar -xJf /tmp/ff.tar.xz -C /tmp
            sudo mv /tmp/ffmpeg-*/ffmpeg /usr/local/bin/
            sudo mv /tmp/ffmpeg-*/ffprobe /usr/local/bin/
          fi
          ffmpeg -version | head -n 1

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Discover sources
        env:
          CHOCODATA_API_KEY: ${{ secrets.CHOCODATA_API_KEY }}
        run: python src/find_sources.py

      - name: Run pipeline
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          CHOCODATA_API_KEY: ${{ secrets.CHOCODATA_API_KEY }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python src/main.py

      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sources.json
          git commit -m "chore: update source state [skip ci]" || echo "no changes"
          git push